<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Method Display</title>
    <link rel="stylesheet" href="output.css">
</head>
<body class="flex justify-center flex-col items-center bg-black font-serif text-white">
    <h1 class="text-5xl font-bold font-serif flex items-center justify-center mt-40 gap-5"><span class="text-orange-500">Object</span><span class="text-white">Method</span><span class="text-green-500">Display</span></h1>
    <label for="" class="mt-10 text-2xl">Add Object Method</label>
    <input type="text" id="key" placeholder="Enter key name: " class="border border-white rounded-lg outline-none p-2 mt-5 px-9 text-left" autocomplete="off">
    <input type="text" id="value" placeholder="Enter value name: " class="border border-white rounded-lg outline-none p-2 mt-5 px-9" autocomplete="off">
    <button class="mt-5 p-2  px-5 border border-amber-800 rounded-lg bg-yellow-300 text-black font-bold font-serif hover:bg-amber-800 hover:text-white" onclick="addDisplayMethod()">Add details</button>

    <ul id="list" class="text-white mt-5 list-disc">

    </ul>

    <script src="16-Object-Method-display.js"></script>
</body>
</html>
