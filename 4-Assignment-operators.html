<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment-Operators</title>
    <link rel="stylesheet" href="output.css">
    <script src="4-Assignment-operators.js"></script>
</head>
<body class="flex justify-center flex-col items-center bg-black">
    <h1 class="text-5xl font-bold font-serif flex items-center justify-center mt-50 gap-5"><span class="text-orange-500">Assignment </span><span class="text-white"> Operators</span> <span class="text-green-500">JavaScript</span>   </h1>
    <div class="mt-5 space-x-3">
        <button class="mt-5 p-3 border border-amber-800 rounded-2xl bg-orange-500 text-amber-50 font-bold font-serif hover:bg-amber-300 hover:text-black" onclick="equalNumbers()">Assignment</button>
        <button class="mt-5 p-3 border border-amber-800 rounded-2xl bg-blue-500 text-amber-50 font-bold font-serif hover:bg-amber-300 hover:text-black" onclick="addAssignment()">Addition</button>
        <button class="mt-5 p-3 border border-amber-800 rounded-2xl bg-green-500 text-amber-50 font-bold font-serif hover:bg-amber-300 hover:text-black" onclick="subAssignment()">Subtraction </button>
        <button class="mt-5 p-3 border border-amber-800 rounded-2xl bg-red-500 text-amber-50 font-bold font-serif hover:bg-amber-300 hover:text-black" onclick="multiAssignment()">Multiplication </button>
        <button class="mt-5 p-3 border border-amber-800 rounded-2xl bg-amber-500 text-amber-50 font-bold font-serif hover:bg-amber-300 hover:text-black" onclick="divisionAssignment()">Division </button>
        <button class="mt-5 p-3 border border-amber-800 rounded-2xl bg-sky-500 text-amber-50 font-bold font-serif hover:bg-amber-300 hover:text-black" onclick="remainderAssignment()">Remainder </button>
        <button class="mt-5 p-3 border border-amber-800 rounded-2xl bg-sky-500 text-amber-50 font-bold font-serif hover:bg-amber-300 hover:text-black" onclick="exponentiationAssignment()">Exponentiation </button>
    </div>
    
</body>
</html>
