<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input-field-style</title>
    <link rel="stylesheet" href="output.css">
</head>
<body class="flex justify-center flex-col items-center bg-black font-serif">
    <h1 class="text-5xl font-bold font-serif flex items-center justify-center mt-20 gap-5"><span class="text-orange-500">Input </span><span class="text-white"> Field</span> <span class="text-green-500">Style</span></h1>
    <input type="text" id="name" placeholder="Enter your name: " class="text-white mt-15 border border-amber-400 p-2 w-70 outline-none rounded-2xl " autocomplete="off">
    <input type="range" id="range" min="20" max="300" step="10" class="mt-5 " onchange="handleWidth(event)">
    <input type="range" id="range" min="40" max="50" step="1" class="mt-5" onchange="handleHight(event)">
    <button class="text-white mt-5 cursor-pointer hover:text-green-500 " onclick="stylehandle()">Update Style</button>


    <script src="9-Input-field-style.js"></script>
</body>
</html>
