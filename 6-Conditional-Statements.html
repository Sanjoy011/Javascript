<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <script src="6-Conditional-Statements.js"></script>
    <title>Conditional-Statements</title>
</head>
<body class="flex justify-center flex-col items-center bg-black">
    <h1 class="text-5xl font-bold font-serif flex items-center justify-center mt-50 gap-5"><span class="text-orange-500">Conditional </span><span class="text-white"> Statements</span> <span class="text-green-500">JavaScript</span>   </h1>
    <div class="mt-5 space-x-3">
        <button class="mt-5 p-3 border border-amber-800 rounded-2xl bg-orange-500 text-amber-50 font-bold font-serif hover:bg-amber-300 hover:text-black" onclick="ifElse()">If else statement</button>
        <button class="mt-5 p-3 border border-amber-800 rounded-2xl bg-blue-500 text-amber-50 font-bold font-serif hover:bg-amber-300 hover:text-black" onclick="logicalOr()">Switch statement</button>
        <button class="mt-5 p-3 border border-amber-800 rounded-2xl bg-green-500 text-amber-50 font-bold font-serif hover:bg-amber-300 hover:text-black" onclick="TernaryOperator()">Ternary operator </button>
        <button class="mt-5 p-3 border border-amber-800 rounded-2xl bg-red-500 text-amber-50 font-bold font-serif hover:bg-amber-300 hover:text-black" onclick="TernaryOperatorPart2()">Ternary operator part-1</button>
        <button class="mt-5 p-3 border border-amber-800 rounded-2xl bg-pink-500 text-amber-50 font-bold font-serif hover:bg-amber-300 hover:text-black" onclick="breakStatement()">Break Statements</button>
        <button class="mt-5 p-3 border border-amber-800 rounded-2xl bg-yellow-500 text-amber-50 font-bold font-serif hover:bg-amber-300 hover:text-black" onclick="continueStatement()">Continue Statements</button>
    </div>
</body>
</html>
